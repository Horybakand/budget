<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f9d94">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<title>My Budget</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f9d94'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='white' stroke-width='7' stroke-dasharray='70 31' transform='rotate(-90 32 32)'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230f9d94'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='white' stroke-width='7' stroke-dasharray='70 31' transform='rotate(-90 32 32)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday money tool: calm, light, friendly; opened many times a day on a phone
   IDEA a set of fresh envelopes, each with a fill line and a pencil tick for "where you should be today"
   PICTURE the green hero card with the money left, then rounded envelope bars; charts tab: donut, pace line, month columns
   COLOUR near-white ground, white cards, fresh green lead, coral for overspent, amber for "slow down", soft multi-hue for charts
   TYPE Plus Jakarta Sans, heavy for figures
   LAYOUT phone-first single column with bottom tab bar and floating Add; on wide screens two columns of cards */
:root{color-scheme:light dark;
--bg:light-dark(#f3f6f4,#0d1311);--card:light-dark(#ffffff,#161f1b);--ink:light-dark(#14201b,#e6eee9);--mute:light-dark(#62706a,#97a59e);
--line:light-dark(#e3e9e5,#25302b);--track:light-dark(#edf2ef,#222c27);--green:#0e9f6e;--greenD:light-dark(#0b7a55,#3fd19b);
--coral:light-dark(#e5533f,#ff7a66);--amber:light-dark(#c27c0e,#f3b443);--soft:light-dark(#e7f6ef,#14302a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,sans-serif;overflow-x:clip;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.bar0{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top)}
.bar0 .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:60px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}
.logo{width:28px;height:28px;border-radius:9px;background:var(--green);display:grid;place-items:center}
.mnav{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px}
.mnav button{border:0;background:none;width:40px;height:40px;border-radius:11px;font-size:20px;color:var(--mute)}
.mnav button:hover{background:var(--track)}
.mnav #mlabel{font-size:15px;font-weight:800;min-width:7.2em;width:auto;padding:0 8px;text-align:center;white-space:nowrap;color:var(--ink)}
.mnav #mlabel::after{content:"▾";font-size:11px;margin-left:5px;color:var(--mute)}
.yr{margin:16px 2px 8px;font-weight:800;font-size:15px}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mgrid button{position:relative;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:15px}
.mgrid button.fut{background:var(--card)}
.mgrid button.past{color:var(--mute)}
.mgrid button.now{border:2px solid var(--green)}
.mgrid button.sel{background:var(--green);color:#fff;border-color:var(--green)}
.mgrid button.has::after{content:"";position:absolute;left:50%;bottom:7px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--green)}
.mgrid button.sel.has::after{background:#fff}
.mkey{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:14px;align-items:center}
.mkey i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}
.sync{font-size:13px;color:var(--mute);text-align:center;margin:-2px 0 6px;min-height:19px}
.sync.err{color:var(--coral)}
.hero{border-radius:26px;padding:22px 20px 18px;color:#fff;background:linear-gradient(150deg,#12b37d,#0b7a55);box-shadow:0 10px 30px -12px rgba(11,122,85,.55);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero small{font-size:14px;opacity:.85;font-weight:600}
.hero .big{font-size:clamp(42px,12vw,64px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:2px 0 4px;white-space:nowrap}
.hero p{margin:0;font-size:15px;opacity:.95}
.hstrip{margin-top:16px;display:grid;gap:8px}
.hstrip div{display:flex;justify-content:space-between;font-size:13px;font-weight:600;opacity:.9}
.hstrip i{display:block;height:8px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:3px}
.hstrip i em{display:block;height:100%;background:#fff;border-radius:4px}
.hstrip .sp i em{background:#ffe08a}
.pill{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.14);border-radius:16px;padding:10px 10px 10px 14px;font-size:14px}
.pill button{border:0;border-radius:12px;min-height:40px;padding:0 14px;background:#fff;color:#0b7a55;font-weight:700;white-space:nowrap}
h2{font-size:19px;margin:26px 0 10px;letter-spacing:-.01em}
h3{font-size:14px;margin:18px 4px 8px;color:var(--mute);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px}
.pad{padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:0 18px;align-items:start}
.alert{display:flex;gap:12px;align-items:center;padding:12px 12px 12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.alert .ic{width:10px;height:10px;border-radius:50%;flex:none;background:var(--coral)}
.alert.warn .ic{background:var(--amber)}
.alert p{margin:0;flex:1;font-size:15px}
.btn{border:0;border-radius:14px;min-height:46px;padding:0 18px;font-weight:700;background:var(--green);color:#fff;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--greenD)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn.full{width:100%;min-height:54px;font-size:17px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:13px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
.row:active{background:var(--track)}
.nm{font-weight:700;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.av{font-weight:800;text-align:right;white-space:nowrap;font-size:17px}
.sub{grid-column:1/-1;font-size:13px;color:var(--mute)}
.meter{grid-column:1/-1;position:relative;height:9px;background:var(--track);border-radius:5px;margin-top:6px}
.meter em{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--green);max-width:100%}
.meter .tick{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--mute);opacity:.9}
.s-over .av,.s-over .st{color:var(--coral)}.s-over .meter em{background:var(--coral)}
.s-ahead .st{color:var(--amber)}.s-ahead .meter em{background:var(--amber)}
.s-due .meter em{background:#9db3a9}.s-save .meter em{background:#3b82f6}
.s-paid .st{color:var(--greenD)}
.rw{display:flex;align-items:center;border-top:1px solid var(--line)}
.rw:first-child{border-top:0}
.rw .row{border-top:0;flex:1;padding-right:6px}
.ck{flex:none;width:46px;height:46px;margin-right:6px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--line)}
.ck svg circle{fill:none;stroke:currentColor;stroke-width:1.8}
.ck svg path{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.0}
.ck:hover{color:var(--mute)}.ck:hover svg path{opacity:.6}
.ck.on{color:var(--green)}.ck.on svg circle{fill:var(--green)}.ck.on svg path{stroke:#fff;opacity:1}
@media(prefers-reduced-motion:no-preference){.ck svg circle{transition:fill .2s}}
.s-closed .meter em{background:#b9c6c0}
.meter{height:12px;border-radius:6px}
.meter em.ov{background:var(--coral);border-radius:0 6px 6px 0}
.meter .limit{position:absolute;top:-7px;bottom:-5px;width:3px;border-radius:2px;background:var(--ink)}
.plab{grid-column:1/-1;position:relative;height:17px;margin-top:4px}
.plab span{position:absolute;bottom:0;font-size:12px;color:var(--mute);white-space:nowrap;line-height:1}
.plab b{color:var(--ink);font-weight:800}
.row .meter{margin-top:6px}
.lim{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute);margin-top:5px}
.lim b{color:var(--ink);font-weight:700}
.lim span:last-child{text-align:right;white-space:nowrap}
.lim .t-over{color:var(--coral)}.lim .t-warn{color:var(--amber)}.lim .t-ok{color:var(--greenD)}
.av small{display:block;font-size:11px;font-weight:600;color:var(--mute);text-align:right;margin-top:-2px}.s-closed .av{color:var(--mute);font-weight:700}.s-closed .nm{color:var(--mute)}
.lock{font-size:11px;font-weight:800;color:var(--mute);background:var(--track);border-radius:6px;padding:1px 6px}
.tx{display:flex;gap:12px;align-items:center;padding:11px 10px 11px 16px;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.tx .d{color:var(--mute);font-size:13px;width:3.4em;flex:none;line-height:1.2}
.tx .w{flex:1;line-height:1.3}
.tx .w small{display:block;color:var(--mute);font-size:13px}
.tx .a{font-weight:700;white-space:nowrap}
.x{border:0;background:none;width:40px;height:40px;border-radius:12px;font-size:20px;color:var(--mute);flex:none}
.x:hover{background:var(--track)}
.empty{padding:18px 16px;color:var(--mute);margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{min-height:42px;padding:0 14px;border-radius:21px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.chips button[aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}
.hs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;scrollbar-width:none}
.hs button{flex:none}
.lead{font-size:clamp(21px,5.5vw,27px);font-weight:800;line-height:1.2;letter-spacing:-.02em;margin:10px 0 6px}
.muted{color:var(--mute);font-size:14px}
.wk{display:grid;grid-template-columns:5.2em minmax(0,1fr) 5.8em;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.wk:first-child{border-top:0}
.wk .meter{margin:0;height:14px;border-radius:7px;grid-column:auto}
.wk .meter em{border-radius:7px}
.wk .v{text-align:right;font-weight:700;white-space:nowrap;font-size:15px;line-height:1.2}
.wk .v small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.wk.now{background:var(--soft)}
.wk.fut{opacity:.45}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 12px;border-top:1px solid var(--line);text-align:left;font-size:14px}
th{font-size:12px;color:var(--mute);font-weight:700;border-top:0}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.fig{position:relative;width:100%}
.donut{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:18px;align-items:center}
.legend{display:grid;gap:8px}
.legend div{display:flex;align-items:center;gap:8px;font-size:14px}
.legend b{margin-left:auto;white-space:nowrap}
.legend span.p{color:var(--mute);width:3em;text-align:right;flex:none}
.pv{display:grid;gap:12px}
.pv .l{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.pv .l b{white-space:nowrap}
.pv .t{position:relative;height:12px;background:var(--track);border-radius:6px;margin-top:4px}
.pv .t em{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.cols{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:24px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.cols .bars{width:100%;max-width:46px;flex:1;display:flex;align-items:flex-end;position:relative}
.cols .bars em{font-style:normal;width:100%;border-radius:10px 10px 4px 4px;background:var(--green);display:block;position:relative}
.cols .bars em.over{background:var(--coral)}
.cols .bars i{position:absolute;left:-4px;right:-4px;height:3px;border-radius:2px;background:var(--ink);opacity:.7}
.cols .bars span{position:absolute;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap;bottom:calc(100% + 4px)}
.cols .lb{font-size:12px;color:var(--mute);font-weight:600}
.cols .c.cur .lb{color:var(--ink)}
.key{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:10px}
.key span{display:flex;align-items:center;gap:6px}
.key i{display:inline-block;width:14px;height:4px;border-radius:2px;background:var(--ink)}
.f{display:grid;gap:6px;margin-bottom:14px}
.f label{font-size:14px;font-weight:700}
input,select{min-height:46px;font-size:16px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--card);width:100%}
input:focus,select:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 25%,transparent)}
.amt{font-size:36px;font-weight:800;height:70px;text-align:center}
.pl{display:grid;grid-template-columns:minmax(0,1fr) 7.2em 40px;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.pl:first-child{border-top:0}
.pl .opt{grid-column:1/-1;display:flex;gap:10px 16px;flex-wrap:wrap;font-size:13px;color:var(--mute);align-items:center}
.pl .opt label{display:flex;gap:6px;align-items:center}
.pl .opt input[type=checkbox]{width:20px;min-height:20px;accent-color:var(--green)}
.pl .opt select{min-height:40px;width:auto;max-width:100%;font-size:14px;padding:0 10px;border-radius:10px}
.pl .opt{padding:4px 0 6px}
.ghead{display:flex;align-items:center;gap:10px;margin:20px 4px 8px}
.gname{flex:1;min-height:40px;border:0;border-bottom:1.5px dashed var(--line);border-radius:0;background:transparent;padding:0 2px;font-size:15px;font-weight:800;color:var(--ink)}
.gname:focus{border-bottom:2px solid var(--green);box-shadow:none}
.pl .opt[hidden]{display:none}
[data-more]{font-size:22px;font-weight:800;letter-spacing:1px}
[data-more][aria-expanded=true]{background:var(--soft);color:var(--greenD)}
.sum{display:grid;gap:6px;padding:16px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum div b{white-space:nowrap}
.sum .tot{border-top:1px solid var(--line);padding-top:10px;margin-top:4px;font-size:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.tabs div{display:flex;gap:4px;width:100%;max-width:560px}
.tabs button{flex:1;border:0;background:none;min-height:54px;border-radius:14px;font-size:12px;font-weight:700;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current=true]{color:var(--greenD);background:var(--soft)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(80px + env(safe-area-inset-bottom));z-index:31;min-height:58px;padding:0 22px 0 18px;border-radius:29px;border:0;background:var(--green);color:#fff;font-weight:800;font-size:16px;box-shadow:0 10px 24px -8px rgba(11,122,85,.7);display:flex;align-items:center;gap:8px}
.fab b{font-size:26px;line-height:1;margin-top:-2px}
.veil{position:fixed;inset:0;background:rgba(10,20,16,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
.veil.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:540px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px max(18px,env(safe-area-inset-left)) calc(22px + env(safe-area-inset-bottom))}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shead h2{margin:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 8px 8px 16px;display:none;gap:10px;align-items:center;z-index:50;width:max-content;max-width:calc(100% - 32px);font-size:14px}
.toast.on{display:flex}
.toast button{background:none;border:0;color:var(--bg);font-weight:800;min-height:40px;padding:0 10px}
.calc{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px;margin-top:4px}
.disp{display:flex;flex-direction:column;align-items:flex-end;padding:6px 8px 12px;min-height:84px;justify-content:flex-end}
#expr{font-size:clamp(30px,9vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere;text-align:right}
#expr.ph{color:var(--mute);opacity:.5}
#res{font-size:16px;color:var(--greenD);font-weight:700;min-height:22px}
#res.err{color:var(--coral)}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.keys button{min-height:54px;border:0;border-radius:16px;background:var(--track);font-size:22px;font-weight:700}
.keys button:active{transform:scale(.96)}
.keys .op{background:var(--soft);color:var(--greenD);font-size:24px}
.keys .bk{font-size:20px;color:var(--mute)}
.full2{width:100%;min-height:50px}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:10px}
.two span{display:none}
#closeLine,#reopen{margin-top:10px}
.cap{margin:6px 4px 0;font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--track);border-radius:14px;padding:4px;margin:4px 0 10px}
.seg button{min-height:42px;border:0;border-radius:11px;background:none;font-weight:700;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.sw{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.sw input{width:24px;min-height:24px;margin-top:2px;accent-color:var(--green);flex:none}
.inrow .nm{font-weight:600}
.wkline{margin-top:12px;padding:14px 16px}
.wkline .meter{margin-top:10px}
.pickhint{margin:14px 2px 8px;font-size:14px;font-weight:700;color:var(--mute)}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats button{min-height:46px;padding:0 16px 0 12px;border-radius:23px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.cats button:active{background:var(--green);color:#fff;border-color:var(--green)}
.cats button small{font-weight:500;color:var(--mute);font-size:12px}
.cats .morec{border-style:dashed;color:var(--mute)}
#moreBox{display:contents}
#moreBox[hidden]{display:none}
.linkb{border:0;background:none;color:var(--greenD);font-weight:700;font-size:14px;padding:14px 2px 6px;min-height:44px}
.setup{max-width:520px;margin:24px auto 0}
.setup h1{font-size:clamp(30px,8vw,40px);line-height:1.1;letter-spacing:-.02em;margin:18px 0 8px}
.setup ol{padding-left:20px;margin:8px 0}
.setup li{margin-bottom:6px;font-size:15px}
.setup a{color:var(--greenD);font-weight:700}
.stack{display:grid;gap:10px}
.demo{display:inline-block;background:#ffe08a;color:#5a4300;border-radius:8px;font-size:12px;font-weight:800;padding:2px 8px;margin-left:6px;vertical-align:middle}
@media(min-width:760px){.fab{bottom:calc(86px + env(safe-area-inset-bottom))}.veil{align-items:center}.sheet{border-radius:26px}}
@media(max-width:420px){.mnav #mlabel{min-width:0;padding:0 4px}.mnav button{width:36px}.brand{gap:6px;font-size:17px;white-space:nowrap}.demo{margin-left:4px;padding:2px 6px}.donut{grid-template-columns:minmax(0,1fr)}.donut .fig{max-width:220px;margin:0 auto}.wk{grid-template-columns:4.6em minmax(0,1fr) 5.4em;padding:12px}.pl{grid-template-columns:minmax(0,1fr) 6.4em 40px}th,td{padding:9px 6px}}
@media(prefers-reduced-motion:no-preference){.meter em,.hstrip em,.pv em,.cols em{transition:width .45s ease,height .45s ease}}

/* ---- v2: friendlier palette, plan theme, entry screen ---- */
:root{--bg:light-dark(#f3f7f6,#0d1312);--green:#0f9d94;--greenD:light-dark(#0b7c75,#45d0c5);--coral:light-dark(#e8893b,#ffad6b);--amber:light-dark(#c4900f,#f1c048);--soft:light-dark(#e2f3f1,#12302d);--blue:#8d7ff2}
.hero{background:linear-gradient(150deg,#19b3a6,#0f7f86);box-shadow:0 10px 30px -12px rgba(15,127,134,.5)}
.hero .hbar{margin-top:14px;display:grid;grid-template-columns:minmax(0,1fr)}
.hero .meter{background:rgba(255,255,255,.25)}
.hero .meter em{background:#fff!important}
.hero .meter em.ov{background:#ffd7a8!important}
.hero .meter .limit{background:#fff}
.hero .plab span{color:rgba(255,255,255,.85)}.hero .plab b{color:#fff}
.hero .hfoot{margin-top:8px;font-size:14px}
h2.big2{font-size:22px;font-weight:800;margin:26px 2px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2.big2 small{font-size:14px;font-weight:600;color:var(--mute)}
.planhead{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;margin:4px 0 4px}
.planhead .t{font-size:13px;font-weight:800;color:var(--greenD);margin:2px 4px 8px;display:flex;align-items:center;gap:6px}
.planhead .seg{margin:0}
.scopehint{margin:8px 4px 0;font-size:13px}
.tagrow{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:-2px}
.tag{font-size:12px;font-weight:700;color:var(--greenD);background:var(--soft);border-radius:8px;padding:2px 8px}
.rs{padding:0!important;min-height:0!important;font-size:12px!important}
.alab{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:4px 2px 6px}
.amtbox{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--green);border-radius:18px;padding:0 16px}
.amtbox .cur{font-size:26px;font-weight:800;color:var(--mute)}
#amtIn{border:0;box-shadow:none;font-size:34px;font-weight:800;height:66px;padding:0;background:transparent;text-align:right;min-width:0}
#amtIn:focus{box-shadow:none}
#res{min-height:22px;text-align:right;font-weight:700;color:var(--greenD);font-size:15px;margin:4px 4px 0}
#res.err{color:var(--coral)}
.pfoot{margin-top:16px;padding:14px 4px 0;border-top:1px solid var(--line)}
#pview{display:flex;align-items:center;gap:8px}
#pview[hidden]{display:none}
#pview b{font-size:17px}
.pen{border:0;background:var(--soft);color:var(--greenD);border-radius:10px;width:38px;height:38px;font-size:17px;margin-left:auto}
#penF:not([hidden]){display:flex;gap:8px;align-items:center}
#penF input{flex:1}
.plinks{display:flex;gap:20px;flex-wrap:wrap}
.penhint{margin:6px 0 0;font-size:12px}
details.others{margin-top:10px}
details.others summary{cursor:pointer;color:var(--mute);font-weight:700;font-size:14px;padding:12px 4px;list-style:none}
details.others summary::-webkit-details-marker{display:none}
details.others summary::before{content:"▸ "}
details.others[open] summary::before{content:"▾ "}
.rmb{color:var(--coral)!important}

/* ---- v3: year picker, reports, receipts ---- */
.yrnav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.yrnav b{font-size:22px}
.yrnav button{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:22px;color:var(--mute)}
.sumseg{margin:4px 0 6px}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.presets button{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.presets button[aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}
.range{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.range label{font-size:13px;font-weight:700;color:var(--mute);display:grid;gap:4px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.kpi small{display:block;font-size:13px;color:var(--mute);font-weight:600}
.kpi b{display:block;font-size:clamp(20px,6vw,26px);font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.kpi.neg b{color:var(--coral)}.kpi.pos b{color:var(--greenD)}
.rcols{display:flex;align-items:flex-end;gap:6px;height:200px;padding:26px 6px 2px;overflow-x:auto}
.rcols .c{flex:1 0 28px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.rcols .bars{width:100%;max-width:40px;flex:1;position:relative;display:flex;align-items:flex-end}
.rcols .bars em{font-style:normal;width:100%;border-radius:8px 8px 3px 3px;background:var(--green);display:block}
.rcols .bars em.over{background:var(--coral)}
.rcols .bars i{position:absolute;left:-3px;right:-3px;height:3px;border-radius:2px;background:var(--ink);opacity:.7}
.rcols .lb{font-size:11px;color:var(--mute);font-weight:600;white-space:nowrap}
.share{display:grid;gap:4px;padding:12px 16px;border-top:1px solid var(--line)}
.share:first-child{border-top:0}
.share .l{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.share .l b{white-space:nowrap}
.share .t{height:8px;border-radius:4px;background:var(--track);position:relative}
.share .t em{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--green)}
.share small{color:var(--mute);font-size:12px}
details.grp>summary{list-style:none;cursor:pointer}
details.grp>summary::-webkit-details-marker{display:none}
details.grp .sub2{padding:0 16px 10px 30px;display:grid;gap:6px}
details.grp .sub2 div{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--mute)}
details.grp .sub2 b{color:var(--ink);white-space:nowrap}
.dlrow{display:grid;gap:10px;margin-top:14px}
.camrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
.camrow label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:96px;border-radius:20px;font-weight:800;cursor:pointer;text-align:center}
.camrow .cam{background:var(--green);color:#fff}
.camrow .upl{background:var(--soft);color:var(--greenD)}
.camrow input{display:none}
.rc{display:flex;gap:12px;align-items:center;padding:10px 12px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.rc:first-child{border-top:0}
.rc .th{width:52px;height:52px;border-radius:12px;background:var(--track) center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--mute);font-size:20px}
.rc .w{flex:1;line-height:1.3}
.rc .w small{display:block;color:var(--mute);font-size:13px}
.rc .a{font-weight:800;white-space:nowrap}
.todo{display:inline-block;font-size:11px;font-weight:800;color:#8a5a00;background:#ffe6b8;border-radius:6px;padding:1px 6px}
.rcimg{width:100%;max-height:260px;object-fit:contain;border-radius:16px;background:var(--track);display:block}
.split{display:grid;grid-template-columns:minmax(0,1fr) 7em 40px;gap:8px;align-items:center;margin-bottom:8px}
.rtotal{display:flex;justify-content:space-between;font-weight:800;font-size:17px;margin:6px 2px 14px}
.badge{position:absolute;top:4px;right:calc(50% - 26px);min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.tabs button{position:relative}
.badge[hidden]{display:none}
.rtag{font-size:11px;font-weight:700;color:var(--mute);background:var(--track);border-radius:6px;padding:0 5px;margin-left:4px}

/* ---- v4: soft glassy blue theme on a whitish page ---- */
:root{--bg:light-dark(#f6f9fd,#0e1219);--card:light-dark(#ffffff,#161c27);--ink:light-dark(#1b2433,#e7edf6);--mute:light-dark(#6b7789,#99a6b8);
--line:light-dark(#e5ecf5,#243043);--track:light-dark(#edf2f9,#202a39);--green:#4c94ee;--greenD:light-dark(#2f76d2,#8ec5ff);--soft:light-dark(#e9f3ff,#162639);
--coral:light-dark(#ee8a6f,#ffa48c);--amber:light-dark(#d89a2e,#f1c35e);--blue:#8d7ff2;
--fillg:linear-gradient(90deg,#93cdff,#4c8ef0);--overg:linear-gradient(90deg,#ffc2a8,#f08b70);
--shadow:0 8px 24px -14px rgba(52,110,190,.35);
--hue1:#8fcbff;--hue2:#4c8ef0}
body[data-tab=plan]{--hue1:#c3b6ff;--hue2:#7f86f2}
body[data-tab=actual]{--hue1:#8fcbff;--hue2:#4c8ef0}
body[data-tab=receipts]{--hue1:#8fe3e8;--hue2:#3fa9e0}
body[data-tab=summary]{--hue1:#a9c4ff;--hue2:#6a7ff0}
.card,.kpi,.alert{border-color:var(--line);box-shadow:var(--shadow);border-radius:22px}
.hero{background:radial-gradient(110% 80% at 90% 0%,rgba(255,255,255,.28),transparent 55%),linear-gradient(140deg,#5aa6f5 0%,#4a8ff0 55%,#6f84ee 100%);box-shadow:0 18px 40px -22px rgba(60,120,220,.7);border-radius:28px}
.hero::after{background:rgba(255,255,255,.12)}
.btn{background:linear-gradient(135deg,#79bcff,#4c8ef0);box-shadow:0 8px 18px -12px rgba(60,120,220,.8)}
.btn.ghost{background:var(--soft);color:var(--greenD);box-shadow:none}
.btn.line{background:var(--card);box-shadow:none}
.logo{background:linear-gradient(140deg,#8ccaff,#4c8ef0);border-radius:10px;box-shadow:0 6px 14px -8px rgba(60,120,220,.8)}
.meter em{background:var(--fillg)}
.meter em.ov{background:var(--overg)!important}
.meter .limit{background:var(--ink);opacity:.85}
.keys button{background:var(--card);border:1px solid var(--line);box-shadow:0 3px 8px -6px rgba(52,110,190,.45)}
.keys .op{background:var(--soft);border-color:transparent}
.amtbox{border-color:#8cc0f6;box-shadow:0 0 0 4px var(--soft)}
.ck.on{color:#4c8ef0}.ck.on svg circle{fill:#4c8ef0}
.mnav{box-shadow:var(--shadow)}
input,select{border-color:var(--line)}
/* tab bar: the active tab gets a glossy squircle icon like an app icon */
.tabs{box-shadow:0 -8px 24px -18px rgba(52,110,190,.45);border-top-color:var(--line)}
.tabs button{gap:4px}
.tabs button svg{width:34px;height:34px;padding:6px;border-radius:12px;transition:background .2s}
.tabs button[aria-current=true]{background:none;color:var(--ink)}
.tabs button[aria-current=true] svg{color:#fff;background:radial-gradient(120% 90% at 20% 0%,rgba(255,255,255,.55),transparent 55%),linear-gradient(140deg,var(--hue1),var(--hue2));box-shadow:0 8px 16px -8px var(--hue2)}
/* small page header that tells you which tab you're in */
.pagehead{display:flex;align-items:center;gap:10px;margin:2px 2px 12px}
.pagehead .pi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff;background:radial-gradient(120% 90% at 20% 0%,rgba(255,255,255,.55),transparent 55%),linear-gradient(140deg,var(--hue1),var(--hue2));box-shadow:0 8px 16px -9px var(--hue2)}
.pagehead .pi svg{width:22px;height:22px}
.pagehead b{font-size:20px;font-weight:800;letter-spacing:-.01em}
.pagehead span.m{color:var(--mute);font-weight:600}
.planhead{box-shadow:var(--shadow)}
.planhead .t{display:none}
/* year chips */
.yrs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;margin-bottom:6px}
.yrs button{flex:none;min-height:42px;padding:0 16px;border-radius:21px;border:1px solid var(--line);background:var(--card);font-weight:800;font-size:15px}
.yrs button[aria-pressed=true]{color:#fff;border-color:transparent;background:linear-gradient(135deg,#79bcff,#4c8ef0)}
.yrs button.cy{border-color:#8cc0f6}
.mgrid button.now{border-color:#4c8ef0}
.mgrid button.sel{background:linear-gradient(135deg,#79bcff,#4c8ef0);border-color:transparent}
.mgrid button.has::after{background:#4c8ef0}
.camrow{grid-template-columns:1fr}
.camrow .upl{flex-direction:row;min-height:76px;gap:12px;font-size:17px;color:#fff;background:radial-gradient(120% 90% at 15% 0%,rgba(255,255,255,.4),transparent 55%),linear-gradient(140deg,#8fe3e8,#3fa9e0);box-shadow:0 14px 28px -18px rgba(40,140,200,.9)}
.presets button[aria-pressed=true],.seg button[aria-pressed=true]{box-shadow:0 2px 8px -4px rgba(52,110,190,.4)}
.presets button[aria-pressed=true]{background:linear-gradient(135deg,#79bcff,#4c8ef0)}
.rcols .bars em{background:linear-gradient(180deg,#93cdff,#4c8ef0)}
.rcols .bars em.over,.cols .bars em.over{background:var(--overg)}
.cols .bars em{background:linear-gradient(180deg,#93cdff,#4c8ef0)}
.share .t em{background:var(--fillg)}
.toast{border-radius:18px;box-shadow:0 12px 30px -12px rgba(0,0,0,.4)}

/* ---- v6: the teal theme you picked ---- */
:root{--bg:light-dark(#f3f7f6,#0d1312);--card:light-dark(#ffffff,#161f1b);--ink:light-dark(#14201b,#e6eee9);--mute:light-dark(#62706a,#97a59e);
--line:light-dark(#e3e9e5,#25302b);--track:light-dark(#edf2ef,#222c27);--green:#0f9d94;--greenD:light-dark(#0b7c75,#45d0c5);--soft:light-dark(#e2f3f1,#12302d);
--coral:light-dark(#e8893b,#ffad6b);--amber:light-dark(#c4900f,#f1c048);--blue:#8d8ad0;
--fillg:#0f9d94;--overg:#e8893b;--shadow:none;--hue1:#0f9d94;--hue2:#0f9d94}
body[data-tab=plan]{--hue1:#7c83c9;--hue2:#7c83c9}
body[data-tab=actual]{--hue1:#13a39a;--hue2:#13a39a}
body[data-tab=receipts]{--hue1:#3f8fb5;--hue2:#3f8fb5}
body[data-tab=summary]{--hue1:#c08a4e;--hue2:#c08a4e}
.card,.kpi,.alert,.planhead,.mnav{box-shadow:none;border-radius:20px}
.hero{background:linear-gradient(150deg,#19b3a6,#0f7f86);box-shadow:0 10px 30px -12px rgba(15,127,134,.5);border-radius:26px}
.hero::after{display:block;background:rgba(255,255,255,.08)}
.btn{background:#0f9d94;box-shadow:none}
.btn.ghost{background:var(--soft);color:var(--greenD)}
.btn.line{background:var(--card)}
.logo{background:#0f9d94;box-shadow:none;border-radius:9px}
.meter em{background:var(--fillg)}
.meter em.ov{background:var(--overg)!important}
.keys button{box-shadow:none}
.amtbox{border-color:var(--green);box-shadow:none}
.ck.on{color:#0f9d94}.ck.on svg circle{fill:#0f9d94}
.tabs{box-shadow:none}
.tabs button svg{border-radius:10px}
.tabs button[aria-current=true] svg{background:var(--hue1);box-shadow:none}
.pagehead .pi{background:var(--hue1);box-shadow:none;border-radius:10px}
.yrs button[aria-pressed=true],.mgrid button.sel,.presets button[aria-pressed=true]{background:#0f9d94;box-shadow:none}
.yrs button.cy,.mgrid button.now{border-color:#0f9d94}
.mgrid button.has::after{background:#0f9d94}
.mgrid button.sel.has::after{background:#fff}
.seg button[aria-pressed=true]{box-shadow:none;border:1px solid var(--line)}
.camrow .upl{background:#3f8fb5;box-shadow:none;border-radius:18px}
.rcols .bars em,.cols .bars em{background:#0f9d94}
.rcols .bars em.over,.cols .bars em.over{background:#e8893b}
.share .t em{background:#0f9d94}
.toast{box-shadow:none}
.todo{color:#7a5a12;background:#f6e2b8}
.badge{background:#e8893b}

/* ---- v7: linked headings, group subtotals, plan bar, interactive summary ---- */
h2.big2{margin:28px 0 12px;padding:10px 2px;border-top:1.5px solid color-mix(in srgb,var(--ink) 22%,transparent);border-bottom:1.5px solid color-mix(in srgb,var(--ink) 22%,transparent);align-items:center}
h2.big2 small{font-size:18px;font-weight:800;color:var(--ink);white-space:nowrap}
h2.big2 small i,.ghd i{font-style:normal;font-weight:500;color:var(--mute)}
.ghd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:18px 2px 10px;padding:0 2px 6px;border-bottom:1px solid var(--line);font-size:15px;font-weight:800;color:var(--ink)}
.ghd span:last-child{white-space:nowrap;font-size:15px}
.pbar{position:sticky;top:calc(60px + env(safe-area-inset-top));z-index:15;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px;margin:0 0 12px;box-shadow:0 6px 16px -14px rgba(0,0,0,.4)}
.pcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pcols div{display:grid;gap:1px}
.pcols small{font-size:11px;font-weight:700;color:var(--mute);line-height:1.2}
.pcols b{font-size:17px;font-weight:800;white-space:nowrap}
.pcols .neg b{color:var(--coral)}.pcols .warn b{color:var(--amber)}.pcols .ok b{color:var(--greenD)}
.ped{margin:6px 0 0;font-size:12px;color:var(--mute)}
.ped b{color:var(--ink)}
.tapnote{font-size:13px;margin:10px 2px 0}
.seg.mini{max-width:280px}
.seg.mini button{min-height:36px;font-size:13px}
.legend div{cursor:pointer;border-radius:10px;padding:4px 6px;margin:0 -6px;transition:opacity .15s}
.legend div.dim{opacity:.4}
.legend div.on{background:var(--soft)}
.legend .subl{display:block;padding:2px 0 6px 18px;cursor:default;font-size:13px;color:var(--mute)}
#donut path,#donut circle{cursor:pointer;transition:opacity .15s}
.wkrow{display:block;width:100%;border:0;background:none;text-align:left;padding:0;border-top:1px solid var(--line)}
.wkrow:first-child{border-top:0}
.wkrow .wk{border-top:0}
.wkx{padding:0 16px 12px 16px;display:grid;gap:4px;font-size:14px}
.wkx div{display:flex;justify-content:space-between;gap:10px;color:var(--mute)}
.wkx b{color:var(--ink);white-space:nowrap}
details.pvg{border-top:1px solid var(--line)}
details.pvg:first-child{border-top:0}
details.pvg>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:12px 16px}
details.pvg>summary::-webkit-details-marker{display:none}
details.pvg>summary .gn{font-weight:800}
details.pvg>summary .gn::before{content:"▸ ";color:var(--mute)}
details.pvg[open]>summary .gn::before{content:"▾ "}
details.pvg>summary .gv{font-weight:800;white-space:nowrap}
details.pvg>summary .gv i{font-style:normal;font-weight:500;color:var(--mute)}
.pvc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 16px 8px 30px;border:0;background:none;width:100%;text-align:left;border-top:1px dashed var(--line)}
.pvc .v{white-space:nowrap;font-size:14px}
.pvc .v i{font-style:normal;color:var(--mute)}
.cols .c{cursor:pointer;border:0;background:none;padding:0}
.cols .c.sel .bars em{outline:3px solid color-mix(in srgb,var(--green) 35%,transparent);outline-offset:2px}
.rcols .c{cursor:pointer}
.pvg .plab{display:none}
.pvg .meter{margin-top:8px}
[data-addcat],#addInc{white-space:normal;text-align:left;line-height:1.25;padding:8px 14px;max-width:100%}
.rcols .c.sel .bars em{outline:3px solid color-mix(in srgb,var(--green) 35%,transparent);outline-offset:2px}

/* ---- v8: group headers built into the top of their box ---- */
.gcard{overflow:hidden;margin-bottom:18px}
.grid2 section .gcard{margin-top:0}

<script>
{
/* ======================================================================
   SETTINGS: paste your Dropbox App key between the quotes below.
   (Or leave it empty and type it into the setup screen on each device.)
   ====================================================================== */
const APP_KEY = '';

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const r2=n=>Math.round(n*100)/100;
const now=new Date();
const todayKey=now.getFullYear()+'-'+pad(now.getMonth()+1);
const todayStr=todayKey+'-'+pad(now.getDate());
const KINDS=[['bill','Fixed bill'],['spend','Everyday'],['save','Set aside (rolls over)']];
const gName=c=>c.group||({bill:'Bills',spend:'Everyday spending',save:'Savings goals'})[c.kind]||'Other';
const groupsOf=cats=>[...new Set(cats.map(gName))];
const PAL=['#0f9d94','#7c83c9','#3f8fb5','#e8a05a','#d57a9a','#7fb86a','#d9b443','#6f7f86','#e08a72','#4fb3c9','#a6a35a','#a083c9'];
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let cur='USD';
function curSym(){try{return new Intl.NumberFormat(undefined,{style:'currency',currency:cur}).formatToParts(0).find(p=>p.type==='currency').value}catch(e){return '$'}}
function money(n,dp){const d=dp??(Math.abs(n%1)>0.004?2:0);try{return new Intl.NumberFormat(undefined,{style:'currency',currency:cur,minimumFractionDigits:d,maximumFractionDigits:d}).format(n)}catch(e){return '$'+n.toFixed(d)}}
const dim=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()};
const addM=(k,n)=>{const[y,m]=k.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const mName=(k,f)=>{const[y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString(undefined,f==='s'?{month:'short'}:f==='sy'?{month:'short',year:'numeric'}:{month:'long',year:'numeric'})};
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isFinite(n)?r2(n):0};

/* ---------------- CSV ---------------- */
const csvCell=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s)&&isNaN(+s))s="'"+s;return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
function toCSV(txns,plan){
  const nm=id=>id&&id.startsWith('inc:')?'Income: '+((plan&&plan.income.find(i=>i.id===id.slice(4))||{}).name||''):(plan&&plan.cats.find(c=>c.id===id)||{}).name||'';
  return 'id,date,category_id,category,amount,note,added_by,receipt\n'+[...txns].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.id,t.date,t.cat,nm(t.cat),t.amt.toFixed(2),t.note,t.by||'',t.rc||''].map(csvCell).join(',')).join('\n')+'\n';
}
function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  const h=(rows.shift()||[]).map(s=>s.trim().toLowerCase());const ix=n=>h.indexOf(n);
  const un=s=>/^'[=+\-@\t\r]/.test(s)?s.slice(1):s;
  return rows.filter(r=>r.length>1&&r[ix('date')]).map(r=>({id:r[ix('id')]||rid(),date:r[ix('date')],cat:r[ix('category_id')],amt:num(r[ix('amount')]),note:un(r[ix('note')]||''),by:ix('added_by')>-1?un(r[ix('added_by')]||''):'',rc:ix('receipt')>-1?(r[ix('receipt')]||''):''}));
}

/* ---------------- Dropbox auth (PKCE, no secrets) ---------------- */
const appKey=()=>APP_KEY||ls.get('mb-appkey')||'';
const who=()=>ls.get('mb-who')||'';
let auth=null;try{auth=JSON.parse(ls.get('mb-auth')||'null')}catch(e){}
const b64u=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function pkce(){const a=new Uint8Array(48);crypto.getRandomValues(a);const v=b64u(a);const c=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));ls.set('mb-pkce',v);return c}
const redirectUri=()=>location.origin+location.pathname;
async function authUrl(redirect){
  const p=new URLSearchParams({client_id:appKey(),response_type:'code',code_challenge:await pkce(),code_challenge_method:'S256',token_access_type:'offline'});
  if(redirect)p.set('redirect_uri',redirectUri());
  return 'https://www.dropbox.com/oauth2/authorize?'+p;
}
async function exchange(code,redirect){
  const p=new URLSearchParams({code:code.trim(),grant_type:'authorization_code',code_verifier:ls.get('mb-pkce')||'',client_id:appKey()});
  if(redirect)p.set('redirect_uri',redirectUri());
  const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body:p});
  if(!r.ok)throw new Error('Dropbox did not accept that sign-in. Please try again.');
  const j=await r.json();
  auth={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+((j.expires_in||14400)-120)*1000};
  ls.set('mb-auth',JSON.stringify(auth));ls.del('mb-pkce');
}
async function token(force){
  if(!auth)throw new Error('signed-out');
  if(!force&&auth.exp>Date.now())return auth.access;
  const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body:new URLSearchParams({grant_type:'refresh_token',refresh_token:auth.refresh,client_id:appKey()})});
  if(r.status===400||r.status===401){signOutLocal();throw new Error('signed-out')}
  if(!r.ok)throw new Error('Could not reach Dropbox.');
  const j=await r.json();auth.access=j.access_token;auth.exp=Date.now()+((j.expires_in||14400)-120)*1000;ls.set('mb-auth',JSON.stringify(auth));
  return auth.access;
}
const hdr=o=>JSON.stringify(o).replace(/[\u007f-￿]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0'));
async function dbx(url,{arg,body,json}={},again=true){
  const h={Authorization:'Bearer '+await token()};
  if(arg)h['Dropbox-API-Arg']=hdr(arg);
  if(body!==undefined)h['Content-Type']='application/octet-stream';
  if(json!==undefined)h['Content-Type']='application/json';
  const r=await fetch(url,{method:'POST',headers:h,body:body!==undefined?body:json!==undefined?JSON.stringify(json):undefined});
  if(r.status===401&&again){await token(true);return dbx(url,{arg,body,json},false)}
  return r;
}
async function dl(path){
  const r=await dbx('https://content.dropboxapi.com/2/files/download',{arg:{path}});
  if(r.status===409)return null;
  if(!r.ok)throw new Error('Could not read from Dropbox.');
  let rev=null;try{rev=JSON.parse(r.headers.get('Dropbox-API-Result')||'{}').rev||null}catch(e){}
  return {text:await r.text(),rev};
}
async function up(path,text,rev,exists){
  const mode=rev?{'.tag':'update',update:rev}:exists?{'.tag':'overwrite'}:{'.tag':'add'};
  const r=await dbx('https://content.dropboxapi.com/2/files/upload',{arg:{path,mode,autorename:false,mute:true,strict_conflict:true},body:text});
  if(r.status===409){const e=new Error('conflict');e.conflict=true;throw e}
  if(r.status===507)throw new Error('Your Dropbox is full.');
  if(!r.ok)throw new Error('Could not save to Dropbox.');
  return (await r.json()).rev||null;
}
async function dlBlob(path){
  const r=await dbx('https://content.dropboxapi.com/2/files/download',{arg:{path}});
  if(r.status===409)return null;if(!r.ok)throw new Error('Could not read from Dropbox.');return await r.blob();
}
async function delFile(path){try{await dbx('https://api.dropboxapi.com/2/files/delete_v2',{json:{path}})}catch(e){}}
async function readJSON(path){
  if(mode==='demo'){let v=null;try{v=JSON.parse(ls.get('mb-demo:'+path)||'null')}catch(e){}return {data:v,rev:null,ex:!!v}}
  const r=await dl(path);let d=null;if(r){try{d=JSON.parse(r.text)}catch(e){}}return {data:d,rev:r&&r.rev,ex:!!r};
}
async function updateJSON(path,fn,init){
  /* read, change, write with a version check; retry if another device saved in between */
  for(let i=0;i<5;i++){const r=await readJSON(path),d=r.data||init();fn(d);
    if(mode==='demo'){ls.set('mb-demo:'+path,JSON.stringify(d));return d}
    try{await up(path,JSON.stringify(d,null,1),r.rev,r.ex);return d}catch(e){if(!e.conflict)throw e}}
  throw new Error('Could not save. Try again.');
}
function signOutLocal(){auth=null;ls.del('mb-auth')}
async function signOut(){try{await dbx('https://api.dropboxapi.com/2/auth/token/revoke',{})}catch(e){}signOutLocal();mode='setup';S=null;TPL=null;render()}

/* ---------------- storage: Dropbox or demo ---------------- */
let mode='setup';
const P=k=>({plan:'/'+k+'-plan.json',csv:'/'+k+'-spending.csv'});
async function listMonths(){
  if(mode==='demo'){const out=[];for(let i=0;i<localStorage.length;i++){const m=/^mb-demo-(\d{4}-\d{2})$/.exec(localStorage.key(i));if(m)out.push(m[1])}return out.sort()}
  const out=[];let r=await dbx('https://api.dropboxapi.com/2/files/list_folder',{json:{path:''}});
  for(let n=0;n<20;n++){if(!r.ok)break;const j=await r.json();for(const e of j.entries||[]){const m=/^(\d{4}-\d{2})-plan\.json$/.exec(e.name);if(m)out.push(m[1])}
    if(!j.has_more)break;r=await dbx('https://api.dropboxapi.com/2/files/list_folder/continue',{json:{cursor:j.cursor}})}
  return out.sort();
}
async function loadMonth(k){
  if(mode==='demo'){let v=null;try{v=JSON.parse(ls.get('mb-demo-'+k)||'null')}catch(e){}return {k,plan:v?v.plan:null,txns:v?v.txns:[],planRev:null,csvRev:null,planEx:!!v,csvEx:!!v}}
  const [p,c]=await Promise.all([dl(P(k).plan),dl(P(k).csv)]);
  let plan=null;if(p){try{plan=JSON.parse(p.text)}catch(e){plan=null}}
  return {k,plan,txns:c?parseCSV(c.text):[],planRev:p&&p.rev,csvRev:c&&c.rev,planEx:!!p,csvEx:!!c};
}
/* ---------------- every-month plan ----------------
   template.json holds the plan that repeats every month. Each month keeps its own copy, so a month
   can differ. Changing the every-month plan updates this month and later months, except lines whose
   value was changed for that month (they no longer match the old every-month value). */
let TPL=null;const TPATH='/template.json';
const stripPlan=p=>({v:1,cur:p.cur||'USD',lock:p.lock,income:p.income.filter(i=>!i.only).map(({id,name,amt})=>({id,name,amt})),cats:p.cats.filter(c=>!c.only).map(({id,name,kind,planned,group,roll})=>({id,name,kind,planned,group,roll:!!roll}))});
async function loadTemplate(){
  if(mode==='demo'){let v=null;try{v=JSON.parse(ls.get('mb-demo-tpl')||'null')}catch(e){}return {plan:v,rev:null,ex:!!v}}
  const r=await dl(TPATH);let plan=null;if(r){try{plan=JSON.parse(r.text)}catch(e){}}
  return {plan,rev:r&&r.rev,ex:!!r};
}
let tplQueue=Promise.resolve();
function saveTemplate(fn){
  fn(TPL.plan);
  tplQueue=tplQueue.then(async()=>{
    if(mode==='demo'){ls.set('mb-demo-tpl',JSON.stringify(TPL.plan));return}
    for(let i=0;i<4;i++){
      if(!TPL.rev&&TPL.ex){const R=await loadTemplate();if(R.plan){TPL.plan=R.plan;fn(TPL.plan)}}
      try{TPL.rev=await up(TPATH,JSON.stringify(TPL.plan,null,1),TPL.rev,TPL.ex);TPL.ex=true;return}
      catch(e){if(!e.conflict)throw e;const R=await loadTemplate();TPL.rev=R.rev;TPL.ex=R.ex;if(R.plan)TPL.plan=R.plan;fn(TPL.plan)}
    }
  }).catch(e=>setSync(e.message||'Could not save',true));
  return tplQueue;
}
async function ensureTemplate(){
  TPL=await loadTemplate();
  if(TPL.plan)return;
  let base=null;
  try{const ks=await listMonths();const pick=ks.filter(k=>k<=todayKey).pop()||ks[0];if(pick){const m=await loadMonth(pick);base=m.plan}}catch(e){}
  TPL.plan=stripPlan(base||starterPlan());
  await saveTemplate(()=>{});
}
const fmtWhen=ts=>new Date(ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const tplLine=(t,id)=>TPL&&TPL.plan?(t==='inc'?TPL.plan.income:TPL.plan.cats).find(x=>x.id===id):null;
/* one change to the every-month plan, applied to the template (isMonth=false) or to a month */
function applyOp(p,op,isMonth,txns){
  const L=op.t==='inc'?p.income:p.cats,line=L.find(x=>x.id===op.id);
  if(op.do==='set'){if(line&&(!isMonth||line[op.f]===op.old))line[op.f]=op.v}
  else if(op.do==='add'){if(!line){const n=clone(op.line);if(op.t==='cat'){n.carry=0;n.closed=false;let at=-1;p.cats.forEach((x,i)=>{if(gName(x)===n.group)at=i});at>-1?p.cats.splice(at+1,0,n):p.cats.push(n)}else L.push(n)}}
  else if(op.do==='rm'){if(line){if(isMonth&&txns&&txns.some(t=>t.cat===(op.t==='inc'?'inc:':'')+op.id))line.only=true;else L.splice(L.indexOf(line),1)}}
  else if(op.do==='grp'){p.cats.forEach(c=>{if(gName(c)===op.old)c.group=op.v})}
}
async function changeDefault(op,msg){
  if(lockState().st!=='open'){toast('Defaults are locked. Ask to change them first.');render();return}
  saveTemplate(p=>{applyOp(p,op,false);p.editedBy=who()||'';p.editedAt=Date.now()});
  if(S&&S.plan&&S.k>=todayKey)persist('plan',p=>applyOp(p,op,true,S.txns));else render();
  if(msg)toast(msg);
  let ks=[];try{ks=await listMonths()}catch(e){}
  for(const k of ks){if(k<todayKey||(S&&k===S.k))continue;
    try{const st=await loadMonth(k);if(!st.plan)continue;const fn=p=>applyOp(p,op,true,st.txns);fn(st.plan);await write(st,'plan',fn)}catch(e){}}
  hist={};
}
/* closing a line: if money is left, ask whether it wasn't needed or couldn't be paid */
async function owedToNext(id,amt){
  const nk=addM(key,1),fn=p=>{const c=p.cats.find(x=>x.id===id);if(c){c.owed=amt;c.owedFrom=amt?key:undefined}};
  try{const st=await loadMonth(nk);if(!st.plan)return;fn(st.plan);await write(st,'plan',fn);repCache[nk]=null;hist={}}catch(e){}
}
function setClose(id,mode){
  const c=catOf(id);if(!c)return;const st=calc(S.plan,S.txns,S.k).by[id],left=Math.max(0,r2(st.rawAvail)),next=mName(addM(key,1),'s');
  persist('plan',p=>{const x=p.cats.find(q=>q.id===id);if(!x)return;if(mode){x.closed=true;x.closeMode=mode}else{x.closed=false;delete x.closeMode}});
  if(mode==='short')owedToNext(id,left);else if(st.short)owedToNext(id,0);
  const undo=()=>{persist('plan',p=>{const x=p.cats.find(q=>q.id===id);if(!x)return;x.closed=st.closed;if(st.closed)x.closeMode=st.short?'short':'saved';else delete x.closeMode});owedToNext(id,st.short?left:0)};
  toast(mode==='short'?`${c.name}: ${money(left)} moves to ${next}`:mode?`${c.name} done for ${mName(key,'s')}${left>0.004?' · '+money(left)+' freed':''}`:`${c.name} reopened`,undo);
}
function closeAsk(id){
  const c=catOf(id),st=calc(S.plan,S.txns,S.k).by[id];
  if(st.closed){setClose(id,null);return}
  const left=Math.max(0,r2(st.rawAvail));
  if(left<0.5||c.kind==='save'){setClose(id,'saved');return}
  const mo=esc(mName(key,'s')),next=esc(mName(addM(key,1),'s'));
  openSheet(head(`${esc(c.name)} · ${money(left)} not spent`)+`<p class="muted" style="margin-top:0">What happened to the rest?</p>
   <button type="button" class="choice" data-cm="saved"><b>Done, I didn’t need it</b><span>${money(left)} goes back to money you can give a job.</span></button>

/* ---------------- maths ---------------- */
function calc(plan,txns,k){
  const useCarry=plan.carryOn!==false;
  const D=dim(k),day=k<todayKey?D:k>todayKey?0:now.getDate(),frac=day/D;
  const by={};let planned=0,spent=0,avail=0,flexAvail=0,flexBudget=0,budgetAll=0,freed=0;
  for(const c of plan.cats)by[c.id]={spent:0};
  for(const t of txns)if(by[t.cat])by[t.cat].spent+=t.amt;
  for(const c of plan.cats){
    const s=by[c.id];s.carry=useCarry?(c.carry||0):0;s.owed=c.owed||0;s.budget=c.planned+s.carry+s.owed;s.closed=!!c.closed&&c.kind!=='save';
    s.rawAvail=s.budget-s.spent;
    s.short=s.closed&&c.closeMode==='short';
    s.freed=s.closed&&!s.short?Math.max(0,s.rawAvail):0;   /* not needed: goes back to be given a job */
    s.shortAmt=s.short?Math.max(0,s.rawAvail):0;            /* couldn't pay: moves to next month */
    s.avail=s.rawAvail-s.freed-s.shortAmt;                       /* a closed line has nothing left to spend */
    s.eff=s.closed?s.spent:s.budget;                  /* budget that still counts toward pace */
    s.pct=s.budget>0?s.spent/s.budget:(s.spent>0?1:0);
    if(s.rawAvail<-0.004)s.st='over';
    else if(s.closed)s.st='closed';
    else if(c.kind==='bill')s.st=c.planned>0&&s.spent>=c.planned-0.5?'paid':'due';
    else if(c.kind==='save')s.st='save';
    else s.st=frac>0&&s.spent>s.budget*frac*1.1+5?'ahead':'ok';
    planned+=c.planned+s.owed;spent+=s.spent;avail+=s.avail;budgetAll+=s.eff;freed+=s.freed;
    if(c.kind==='spend'){flexAvail+=Math.max(0,s.avail);flexBudget+=s.eff}
  }
  /* income: what you expect from each source; money actually received is logged as "inc:<source>" entries.
     A source counts at whichever is bigger, so an unexpected bonus becomes money you can give a job. */
  const inc={};let expected=0,received=0,income=0;
  for(const i of plan.income)inc[i.id]={exp:i.amt,got:0};
  for(const t of txns)if(t.cat&&t.cat.startsWith('inc:')){const id=t.cat.slice(4);(inc[id]=inc[id]||{exp:0,got:0}).got+=t.amt}
  for(const id in inc){expected+=inc[id].exp;received+=inc[id].got;income+=Math.max(inc[id].exp,inc[id].got)}
  const overPrev=useCarry?(plan.overPrev||0):0;
  return {by,planned,spent,avail,income,inc,expected,received,useCarry,overPrev,budgetAll,freed,rta:income-planned-overPrev+freed,day,D,frac,flexAvail,flexBudget,daysLeft:k===todayKey?D-day+1:k>todayKey?D:0};
}

function statusText(c,s,C){
  if(s.st==='over')return (s.closed?'Closed · ':'')+'Over by '+money(-s.avail);
  if(s.st==='closed')return s.short?'Paid what I could · '+money(s.shortAmt)+' moves to next month':'Done · spent '+money(s.spent)+' of '+money(s.budget)+(s.freed>0.004?' · '+money(s.freed)+' freed':'');
  if(c.kind==='bill')return s.st==='paid'?'Paid ✓':money(Math.max(0,c.planned-s.spent))+' still to pay';
  if(c.kind==='save')return money(s.avail)+' saved'+(s.carry?' · '+money(s.carry)+' carried in':'');
  if(s.st==='ahead')return 'Spending fast · '+money(s.spent-s.budget*C.frac,0)+' ahead of pace';
  return money(s.spent)+' of '+money(s.budget)+(C.frac>0&&C.frac<1&&s.spent>0?' · on track':'');
}
function barHTML(value,plan,fillCol,label,noOver){

  const gs=groupsOf(S.plan.cats);return gs.map((g,i)=>{const cs=S.plan.cats.filter(c=>gName(c)===g);return {name:g,v:cs.reduce((a,c)=>a+C.by[c.id].spent,0),col:PAL[i%PAL.length],cats:cs}}).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
}
function drawDonut(C){

  let items=donutItems(C);if(items.length>8){const rest=items.slice(7);items=items.slice(0,7).concat([{name:'Everything else',v:rest.reduce((a,x)=>a+x.v,0),col:'#c9d2ce',rest}])}

  const tot=items.reduce((a,x)=>a+x.v,0),W=dn.clientWidth||200,R=W/2,r=R*0.62;let a=-Math.PI/2,paths='';
  if(tot>0)items.forEach((x,i)=>{const f=x.v/tot,b=a+f*Math.PI*2-(items.length>1?0.02:0),L=(b-a)>Math.PI?1:0,op=donutSel<0||donutSel===i?1:.3,grow=donutSel===i?4:0,RR=R-4+grow;
    paths+=f>0.999?`<circle data-di="${i}" cx="${R}" cy="${R}" r="${(RR+r)/2}" fill="none" stroke="${x.col}" stroke-width="${RR-r}" opacity="${op}"/>`
      :`<path data-di="${i}" d="M${R+RR*Math.cos(a)} ${R+RR*Math.sin(a)}A${RR} ${RR} 0 ${L} 1 ${R+RR*Math.cos(b)} ${R+RR*Math.sin(b)}L${R+r*Math.cos(b)} ${R+r*Math.sin(b)}A${r} ${r} 0 ${L} 0 ${R+r*Math.cos(a)} ${R+r*Math.sin(a)}Z" fill="${x.col}" opacity="${op}"/>`;a+=f*Math.PI*2});

   <text x="${R}" y="${R-(sel?14:4)}" text-anchor="middle" font-size="${Math.max(16,W*0.11)}" font-weight="800" fill="var(--ink)">${money(sel?sel.v:tot,0)}</text>
   <text x="${R}" y="${R+(sel?8:16)}" text-anchor="middle" font-size="13" fill="var(--mute)">${sel?esc(nm):'spent so far'}</text>
   ${sel?`<text x="${R}" y="${R+26}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--mute)">${Math.round(sel.v/tot*100)}%</text>`:''}</svg>`;
  lg.innerHTML=items.map((x,i)=>`<div data-di="${i}" class="${donutSel<0?'':donutSel===i?'on':'dim'}"><span class="dot" style="background:${x.col}"></span>${esc(x.name)}<b>${money(x.v,0)}</b><span class="p">${Math.round(x.v/(tot||1)*100)}%</span></div>${donutSel===i&&(x.cats||x.rest)?`<span class="subl">${(x.cats?x.cats.map(c=>({n:c.name,v:C.by[c.id].spent})):x.rest.map(y=>({n:y.name,v:y.v}))).filter(y=>y.v>0).sort((p,q)=>q.v-p.v).map(y=>`${esc(y.n)} ${money(y.v,0)}`).join(' · ')}</span>`:''}`).join('')||'<p class="muted">No spending yet this month.</p>';
  const pick=i=>{donutSel=donutSel===i?-1:i;drawDonut(C)};
  dn.querySelectorAll('[data-di]').forEach(el=>el.onclick=()=>pick(+el.dataset.di));
  lg.querySelectorAll('div[data-di]').forEach(el=>el.onclick=()=>pick(+el.dataset.di));
}
function drawPace(C){
  const pc=$('#pace');if(!pc)return;
  const W=pc.clientWidth,H=pc.clientHeight,m={l:8,r:12,t:24,b:26},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const ids=new Set(S.plan.cats.filter(c=>c.kind==='spend').map(c=>c.id)),daily=new Array(C.D+1).fill(0);
  for(const t of S.txns)if(ids.has(t.cat))daily[+t.date.slice(8)]+=t.amt;
  const cum=[0];for(let d=1;d<=C.D;d++)cum[d]=cum[d-1]+daily[d];
  const last=Math.max(0,C.day),mx=Math.max(C.flexBudget,cum[last]||0,1)*1.08,X=d=>m.l+d/C.D*iw,Y=v=>m.t+ih-v/mx*ih;
  let pts=`${X(0)},${Y(0)}`;for(let d=1;d<=last;d++)pts+=` ${X(d)},${Y(cum[d])}`;
  const over=cum[last]>C.flexBudget*C.frac+1,col=over?'var(--coral)':'var(--green)',lbl=[1,Math.round(C.D/3),Math.round(2*C.D/3),C.D];
  const d=paceDay&&last?Math.min(Math.max(1,paceDay),last):null;
  pc.innerHTML=`<svg width="${W}" height="${H}"><line x1="${m.l}" x2="${W-m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)"/><line x1="${m.l}" x2="${W-m.r}" y1="${Y(C.flexBudget)}" y2="${Y(C.flexBudget)}" stroke="var(--line)"/>
   <text x="${m.l}" y="${Y(C.flexBudget)-6}" font-size="12" fill="var(--mute)">Plan ${money(C.flexBudget,0)}</text>
   <line x1="${X(0)}" y1="${Y(0)}" x2="${X(C.D)}" y2="${Y(C.flexBudget)}" stroke="var(--mute)" stroke-width="2" stroke-dasharray="5 5"/>
   ${last>0?`<polygon points="${pts} ${X(last)},${Y(0)}" fill="${col}" opacity=".12"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round"/>`:''}
   ${d?`<line x1="${X(d)}" x2="${X(d)}" y1="${m.t-6}" y2="${Y(0)}" stroke="var(--ink)" stroke-width="1.5" opacity=".5"/><circle cx="${X(d)}" cy="${Y(C.flexBudget*d/C.D)}" r="4" fill="var(--card)" stroke="var(--mute)" stroke-width="2"/><circle cx="${X(d)}" cy="${Y(cum[d])}" r="6" fill="${col}" stroke="var(--card)" stroke-width="2"/>`
     :last>0?`<circle cx="${X(last)}" cy="${Y(cum[last])}" r="5" fill="${col}" stroke="var(--card)" stroke-width="2"/>`:''}
   ${lbl.map(x=>`<text x="${X(x)}" y="${H-6}" text-anchor="${x===C.D?'end':x===1?'start':'middle'}" font-size="12" fill="var(--mute)">${esc(mName(key,'s'))} ${x}</text>`).join('')}</svg>`;
  const note=$('#paceNote');
  if(note){const dd=d||last;if(dd){const exp=C.flexBudget*dd/C.D,df=cum[dd]-exp;note.innerHTML=`<b>${esc(mName(key,'s'))} ${dd}</b>: spent ${money(cum[dd],0)} on everyday things · a steady pace would be ${money(exp,0)} · <b style="color:${df>1?'var(--coral)':'var(--greenD)'}">${df>1?money(df,0)+' ahead':money(-df,0)+' under'}</b>`}}
  if(!pc.dataset.bound){pc.dataset.bound=1;
    const at=e=>{const r=pc.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;const Cn=calc(S.plan,S.txns,S.k);paceDay=Math.round((x-8)/(r.width-20)*Cn.D);drawPace(Cn)};
    pc.addEventListener('pointerdown',at);pc.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')at(e)});pc.addEventListener('touchmove',at,{passive:true});}
}

function planLine(t,l,def,GS,locked){

  if(!def){if(l.only||!d)tag+=`<span class="tag">Only in ${mo}</span>`;else if(dAmt!==amt)tag+=`<span class="tag">Changed for ${mo} · usually ${money(dAmt)}</span><button type="button" class="linkb rs" data-reset="${k}">Use ${money(dAmt)}</button>`}

/* ---- Defaults are locked; changing them needs both of you ---- */
const UNLOCK_HRS=24;
function lockState(){const L=(TPL&&TPL.plan&&TPL.plan.lock)||{},now=Date.now();
  if(L.ok&&L.ok.until>now)return {st:'open',L};
  if(L.req&&now-L.req.at<7*864e5)return {st:L.req.by===who()?'mine':'theirs',L};
  return {st:'locked',L};}
function lockHTML(lk){
  const L=lk.L,me=who(),demo=mode==='demo';
  if(lk.st==='open')return `<div class="lockc open"><b>🔓 Unlocked</b><span>Approved by ${esc(L.ok.by)} for ${esc(L.req?L.req.by:'')} · until ${esc(fmtWhen(L.ok.until))}. Changes apply to ${esc(mName(todayKey,'s'))} and every month after, except amounts changed for a single month.</span><button type="button" class="btn line sm" data-lock="close">Lock now</button></div>`;
  if(lk.st==='mine')return `<div class="lockc"><b>⏳ Waiting for approval</b><span>You asked to change the defaults. The other person needs to open Defaults on their phone and approve.</span><div class="lrow">${demo?'<button type="button" class="btn sm" data-lock="approve">Approve (demo)</button>':''}<button type="button" class="btn line sm" data-lock="cancel">Cancel request</button></div></div>`;
  if(lk.st==='theirs')return `<div class="lockc ask"><b>✋ ${esc(L.req.by)} wants to change the defaults</b><span>Approving unlocks them for ${UNLOCK_HRS} hours for both of you.</span><div class="lrow"><button type="button" class="btn sm" data-lock="approve">Approve</button><button type="button" class="btn line sm" data-lock="cancel">Decline</button></div></div>`;
  return `<div class="lockc"><b>🔒 Locked</b><span>This is the plan every month starts from. To change it, one of you asks and the other approves.${me?'':' Set this phone’s name in Settings below first.'}</span><button type="button" class="btn sm" data-lock="ask" ${me?'':'disabled'}>Ask to change</button></div>`;
}
async function lockAct(a){
  const now=Date.now(),me=who();
  try{const t=await loadTemplate();if(t.plan)TPL=t}catch(e){}
  const L=(TPL.plan.lock)||{};
  if(a==='ask'){if(!me)return;saveTemplate(p=>{p.lock={req:{by:me,at:now}}});toast('Request sent. Ask your partner to approve in Defaults.')}
  else if(a==='cancel'){saveTemplate(p=>{p.lock={}});toast('Request cleared')}
  else if(a==='approve'){if(!L.req)return;if(mode!=='demo'&&L.req.by===me){toast('The other person has to approve.');return}
    saveTemplate(p=>{p.lock={req:L.req,ok:{by:me||'partner',at:now,until:now+UNLOCK_HRS*3600e3}}});toast('Defaults unlocked for 24 hours')}
  else if(a==='close'){saveTemplate(p=>{p.lock={}});toast('Defaults locked')}
  render();
}

async function shrink(file,max){
  const url=URL.createObjectURL(file),img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('That file isn’t a photo the browser can open.'));img.src=url});
  const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
  c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
}
const blobToData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function storeImage(k,id,blob){

  const r=await dbx('https://content.dropboxapi.com/2/files/upload',{arg:{path:imgPath(k,id),mode:{'.tag':'overwrite'},autorename:false,mute:true},body:blob});
  if(!r.ok)throw new Error(r.status===507?'Your Dropbox is full.':'Could not upload the photo.');
}

/* ---- calculator: + − × ÷ and brackets, no eval ---- */
function evalExpr(src){
  const s=String(src).replace(/[×xX]/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/,/g,'').replace(/\s+/g,'');
  if(!s)return NaN;let i=0;
  const peek=()=>s[i],eat=c=>s[i]===c?(i++,true):false;
  function num(){const m=/^\d*\.?\d+|^\d+\./.exec(s.slice(i));if(!m)return NaN;i+=m[0].length;return parseFloat(m[0])}
  function fac(){if(eat('-'))return -fac();if(eat('+'))return fac();if(eat('(')){const v=add();eat(')');return v}return num()}
  function mul(){let v=fac();while(peek()==='*'||peek()==='/'){const o=s[i++];const r=fac();v=o==='*'?v*r:v/r}return v}
  function add(){let v=mul();while(peek()==='+'||peek()==='-'){const o=s[i++];const r=mul();v=o==='+'?v+r:v-r}return v}
  const v=add();return i===s.length&&isFinite(v)?Math.round(v*100)/100:NaN;
}

function moveSheet(to,amt,from){
  const C=calc(S.plan,S.txns,S.k);
  const opts=(sel,rta)=>(rta?`<option value="rta" ${sel==='rta'?'selected':''}>Not yet assigned (${money(C.rta,0)})</option>`:'')+S.plan.cats.map(c=>`<option value="${esc(c.id)}" ${c.id===sel?'selected':''}>${esc(c.name)} (${money(C.by[c.id].avail,0)} left)</option>`).join('');
  if(!from){const d=donorFor(to,C,num(amt)||1);from=d?d.id:'rta'}
  openSheet(head('Move money')+`<p class="muted" style="margin-top:0">Ran short somewhere? Take it from a category with room instead of breaking the budget.</p><form id="mvF">
  <div class="f"><label for="mvFrom">From</label><select id="mvFrom">${opts(from,true)}</select></div><div class="f"><label for="mvTo">To</label><select id="mvTo">${opts(to,false)}</select></div>
  <div class="f"><label for="mvAmt">Amount</label><input id="mvAmt" inputmode="decimal" value="${amt||''}" placeholder="0.00"></div><button class="btn full">Move it</button><p class="muted" id="mvErr"></p></form>`,()=>{
    $('#mvF').onsubmit=e=>{e.preventDefault();const a=num($('#mvAmt').value),f=$('#mvFrom').value,t=$('#mvTo').value;
      if(a<=0){$('#mvErr').textContent='Enter an amount above zero.';return}if(f===t){$('#mvErr').textContent='Choose two different places.';return}
      const mv=(sign)=>plan=>{if(f!=='rta'){const x=plan.cats.find(c=>c.id===f);if(x)x.planned=r2(x.planned-sign*a)}const y=plan.cats.find(c=>c.id===t);if(y)y.planned=r2(y.planned+sign*a)};
      closeSheet();persist('plan',mv(1));toast(`Moved ${money(a)}`,()=>persist('plan',mv(-1)))};
  });
}
function delTx(id){const t=S.txns.find(x=>x.id===id);if(!t)return;persist('tx',T=>{const i=T.findIndex(x=>x.id===id);if(i>-1)T.splice(i,1)});toast('Entry deleted',()=>persist('tx',T=>{if(!T.some(x=>x.id===t.id))T.push(t)}))}

/* ---------------- events ---------------- */
function bind(){
  const V=$('#view'),all=(q,f)=>V.querySelectorAll(q).forEach(f);
  all('[data-go]',b=>b.onclick=()=>{tab=b.dataset.go;render();scrollTo(0,0)});
  all('[data-cat]',b=>b.onclick=()=>entrySheet('cat',b.dataset.cat));
  all('[data-incopen]',b=>b.onclick=()=>entrySheet('inc',b.dataset.incopen));
  all('[data-done]',b=>b.onclick=()=>closeAsk(b.dataset.done));
  all('[data-del]',b=>b.onclick=()=>delTx(b.dataset.del));
  all('[data-move]',b=>b.onclick=()=>moveSheet(b.dataset.move,b.dataset.amt,b.dataset.from));
  all('[data-sum]',b=>b.onclick=()=>{sumMode=b.dataset.sum;render()});
  all('[data-dm]',b=>b.onclick=()=>{donutMode=b.dataset.dm;donutSel=-1;render()});
  const upl=$('#rcUp');if(upl)upl.onchange=()=>{addPhotos(upl.files);upl.value=''};
  /* ---- Plan tab ---- */
  const def=tab==='defaults';if(def&&lockState().st!=='open'){all('[data-lock]',b=>b.onclick=()=>lockAct(b.dataset.lock))}
  all('[data-lock]',b=>b.onclick=()=>lockAct(b.dataset.lock));
  const P=()=>def?TPL.plan:S.plan;
  const lineOf=k=>{const[t,id]=k.split(':');return {t,id,l:(t==='inc'?P().income:P().cats).find(x=>x.id===id)}};
  all('[data-ln]',i=>i.onchange=()=>{const {t,id,l}=lineOf(i.dataset.ln);if(!l)return;let f=i.dataset.f,v;
    if(f==='amt'){f=t==='inc'?'amt':'planned';v=num(i.value)}else if(f==='roll')v=i.checked;else if(f==='name')v=i.value.trim().slice(0,40)||l.name;else v=i.value;
    if(l[f]===v)return;
    if(def)changeDefault({do:'set',t,id,f,v,old:l[f]});else setMonth(t,id,f,v)});
  all('[data-reset]',b=>b.onclick=()=>{const[t,id]=b.dataset.reset.split(':'),d=tplLine(t,id);if(!d)return;const f=t==='inc'?'amt':'planned';setMonth(t,id,f,d[f])});
  all('[data-more]',b=>b.onclick=()=>{const k=b.dataset.more;openOpts.has(k)?openOpts.delete(k):openOpts.add(k);b.parentNode.querySelector('.opt').hidden=!openOpts.has(k);b.setAttribute('aria-expanded',openOpts.has(k))});
  all('[data-rm]',b=>b.onclick=()=>{const {t,id,l}=lineOf(b.dataset.rm);if(!l)return;
    if(def){changeDefault({do:'rm',t,id},`${l.name} removed from every month`);return}
    const L=t==='inc'?'income':'cats',ix=S.plan[L].indexOf(l),copy=clone(l);
    persist('plan',p=>{p[L]=p[L].filter(x=>x.id!==id)});toast(`${l.name} removed from ${mName(key,'s')}`,()=>persist('plan',p=>{if(!p[L].some(x=>x.id===id))p[L].splice(ix,0,copy)}))});
  const aiA=$('#addIncA');if(aiA)aiA.onclick=incomePick;
  const ai=$('#addInc');if(ai)ai.onclick=()=>{const o={id:rid(),name:'New income',amt:0};
    if(def)changeDefault({do:'add',t:'inc',id:o.id,line:o});else{o.only=true;persist('plan',p=>{p.income.push(o)})}};
  const addCat=g=>{const peers=P().cats.filter(c=>gName(c)===g),k=(peers[peers.length-1]||{}).kind||'spend',c=cat(rid(),'New item',k,0,{group:g});openOpts.add('cat:'+c.id);
    if(def){const {carry,closed,...ln}=c;changeDefault({do:'add',t:'cat',id:c.id,line:ln})}
    else{c.only=true;persist('plan',p=>{let at=-1;p.cats.forEach((x,i)=>{if(gName(x)===g)at=i});at>-1?p.cats.splice(at+1,0,c):p.cats.push(c)})}};
  all('[data-addcat]',b=>b.onclick=()=>addCat(b.dataset.addcat));
  const gf=$('#grpF');if(gf)gf.onsubmit=e=>{e.preventDefault();const g=$('#grpIn').value.trim().slice(0,40);if(g)addCat(g)};
  all('[data-grp]',i=>i.onchange=()=>{const old=i.dataset.grp,nw=i.value.trim().slice(0,40);if(!nw||nw===old){i.value=old;return}
    if(def)changeDefault({do:'grp',old,v:nw},`Renamed to ${nw}`);
    else{persist('plan',p=>{p.cats.forEach(c=>{if(gName(c)===old)c.group=nw})});toast(`Renamed to ${nw} for ${mName(key,'s')}`,()=>persist('plan',p=>{p.cats.forEach(c=>{if(c.group===nw)c.group=old})}))}});
  const cs2=$('#carrySw');if(cs2)cs2.onchange=()=>{const v=cs2.checked;persist('plan',p=>{p.carryOn=v});toast(v?'Leftovers from last month are back in':'Starting this month without last month’s leftovers',()=>persist('plan',p=>{p.carryOn=!v}))};
  const wi=$('#whoIn');if(wi)wi.onchange=()=>{ls.set('mb-who',wi.value.trim().slice(0,20));toast('Saved for this device')};
  const cs=$('#curSel');if(cs)cs.onchange=()=>{const v=cs.value;if(TPL&&TPL.plan)saveTemplate(p=>{p.cur=v});persist('plan',p=>{p.cur=v})};
  const so=$('#signout');if(so)so.onclick=signOut;
  const ed=$('#exitDemo');if(ed)ed.onclick=exitDemo;
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=async()=>{tab=b.dataset.t;render();scrollTo(0,0);if(tab==='defaults'&&mode!=='setup'){try{const t=await loadTemplate();if(t.plan&&JSON.stringify(t.plan)!==JSON.stringify(TPL.plan)){TPL=t;render()}}catch(e){}}});
let pickYear=null,monthsCache=null;
function monthPicker(){
  pickYear=pickYear||+key.slice(0,4);
  const draw=()=>{const ks=[];for(let m=1;m<=12;m++)ks.push(pickYear+'-'+pad(m));
    const cy=+todayKey.slice(0,4),dataYs=(monthsCache||[]).map(k=>+k.slice(0,4));
    const y0=Math.min(cy-10,pickYear,...dataYs),y1=Math.max(cy+15,pickYear),years=[];for(let y=y0;y<=y1;y++)years.push(y);
    openSheet(head('Go to month')+`<div class="yrs" id="yrs">${years.map(y=>`<button type="button" data-y="${y}" aria-pressed="${y===pickYear}" class="${y===cy?'cy':''}">${y}</button>`).join('')}</div>
    <div class="mgrid">${ks.map(k=>`<button data-mk="${k}" class="${k<todayKey?'past':k>todayKey?'fut':''}${k===todayKey?' now':''}${k===key?' sel':''}${monthsCache&&monthsCache.includes(k)?' has':''}">${esc(mName(k,'s'))}</button>`).join('')}</div>
    <div class="mkey"><span><i></i>Has a plan</span><span>Outlined: today</span></div><button class="btn ghost full2" id="mToday" style="margin-top:14px">Back to ${esc(mName(todayKey))}</button>`,()=>{
      $('#sheet').querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{closeSheet();openMonth(b.dataset.mk)});
      $('#mToday').onclick=()=>{pickYear=null;closeSheet();openMonth(todayKey)};
      $('#sheet').querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{pickYear=+b.dataset.y;draw()});
      const ys=$('#yrs'),on=ys&&ys.querySelector('[aria-pressed=true]');if(on)ys.scrollLeft=on.offsetLeft-ys.offsetLeft-ys.clientWidth/2+on.offsetWidth/2;
    })};
  draw();
  listMonths().then(h=>{monthsCache=h;$('#sheet').querySelectorAll('[data-mk]').forEach(b=>{if(h.includes(b.dataset.mk))b.classList.add('has')})}).catch(()=>{});
}
$('#mlabel').onclick=()=>{if(mode!=='setup'){pickYear=+key.slice(0,4);monthPicker()}};
$('#prev').onclick=()=>openMonth(addM(key,-1));
$('#next').onclick=()=>openMonth(addM(key,1));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshQuiet()});

/* ---------------- start ---------------- */
async function boot(){try{await ensureTemplate()}catch(e){}openMonth(todayKey);refreshBadge()}
async function init(){
  const q=new URLSearchParams(location.search);
  if(q.get('code')&&appKey()){
    history.replaceState(null,'',location.pathname);
    try{await exchange(q.get('code'),true)}catch(e){render();const el=$('#authErr');if(el)el.textContent=e.message;return}
  }else if(q.get('error')){history.replaceState(null,'',location.pathname)}
  if(auth){mode='dropbox';boot()}
  else if(ls.get('mb-demo')){mode='demo';boot()}
  else render();
}
init();
}
</script>
</body>
</html>
